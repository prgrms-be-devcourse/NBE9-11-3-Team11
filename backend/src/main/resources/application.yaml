spring:
  application:
    name: backend

  config:
    import: optional:file:.env[.properties]

  datasource:
    # 환경변수 SPRING_DATASOURCE_URL 있으면 그 값 사용(EC2 .env), 없으면 localhost 사용
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/cafe_study?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: true
    defer-datasource-initialization: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${CLIENT_ID}
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:8080/api/V1/auth/oauth/kakao/callback"
            client-name: Kakao
            scope:
              - profile_nickname
              - profile_image


        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  batch:
    job:
      enabled: true # 서버 시작시 자동실행


  # 환경변수 REDIS_HOST가 있으면 그 값 사용(EC2 .env), 없으면 localhost 사용
  # 로컬  → REDIS_HOST 환경변수 없음 → localhost 사용
  # EC2   → REDIS_HOST=redis 주입됨  → redis 컨테이너명으로 접근
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 콜론 뒤 빈값 → 기본값이 빈 문자열
      # CI에서 빈 값 주입 시 AUTH 명령어 안 보냄


jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}

server:
  port: 8080

oauth2:
  redirect-url: "http://localhost:3000"

springdoc:
  default-produces-media-type: application/json; charset=UTF-8

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health
        # prometheus: Prometheus가 메트릭 수집할 엔드포인트 노출 (/actuator/prometheus)
        # health: 서버 상태 확인 엔드포인트 노출 (/actuator/health)