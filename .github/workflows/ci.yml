name: CI
# GitHub Actions 워크플로우 이름 (GitHub Actions 탭에서 표시되는 이름)

on:
  pull_request:
    branches: [ main, dev ]
    # main 또는 dev 브랜치로 PR 올라올 때만 실행
    # feat/* 브랜치에서 push할 때는 실행 안 함
    # PR 단계에서 문제 있는 코드를 걸러내는 게 목적

jobs:
  backend:
    runs-on: ubuntu-latest
    # GitHub에서 제공하는 우분투 서버에서 실행
    # 내 컴퓨터가 꺼져있어도 GitHub 서버에서 알아서 실행됨

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cafe_study
          MYSQL_USER: ${{ secrets.DB_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD }}
          # CI 테스트 환경에서 mysql 연결 필요
          # 없으면 mysql 관련 테스트에서 NullPointerException 발생
          # 컨테이너의 3306 포트를 GitHub Actions 러너의 3306포트로 매핑
          # 이게 있어야 스프링이 localhost:3306으로 mysql에 접근 가능
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7
        # CI 테스트 환경에서 Redis 연결 필요
        # 없으면 Redis 관련 테스트에서 NullPointerException 발생
        # Redis 컨테이너의 6379 포트를 GitHub Actions 러너의 호스트 6379포트로 매핑
        # 이게 있어야 스프링이 localhost:6379로 Redis에 접근 가능
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        # GitHub 레포 코드를 서버에 내려받는 단계
        # 이게 없으면 서버에 코드가 없어서 빌드 자체가 불가능

      - name: Java 25 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          # GitHub 서버에 Java 25 설치
          # 서버는 매번 새로 시작하는 환경이라 항상 설치해줘야 함
          # temurin은 Eclipse에서 관리하는 무료 OpenJDK 배포판
          cache: 'gradle'
          # setup-java가 내부적으로 actions/cache를 자동 실행
          # 경로 지정, 해시 키 생성, 캐시 저장/복원을 전부 알아서 처리
          cache-dependency-path: |
            backend/**/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties
          # 모노레포 구조라서 backend 폴더 경로 명시
          # backend 폴더 안의 gradle 파일 변경 시 캐시 갱신

      - name: Redis 연결 확인
        run: |
          sudo apt-get install -y redis-tools
          redis-cli -h localhost -p 6379 ping
        # Redis 서비스 컨테이너가 정상적으로 떴는지 확인
        # PONG 뜨면 정상, 에러 나면 Redis 연결 문제

      - name: Gradle 실행 권한 부여
        run: chmod +x ./gradlew
        working-directory: backend
        # GitHub 서버에서 체크아웃 받으면 gradlew 파일에 실행 권한(x)이 없음
        # chmod +x로 실행 권한 부여해야 ./gradlew build 실행 가능
        # 이 단계 없으면 Permission denied 에러 나면서 빌드 실패

      - name: Gradle 빌드 및 테스트
        run: ./gradlew build -x test
        working-directory: backend
        # backend 폴더 안에서 ./gradlew build 실행
        # working-directory: 모노레포라서 backend 폴더 지정 필요
        # build = 컴파일 + 테스트 + jar 생성
        # 테스트 실패하면 여기서 CI 실패로 끝남 → PR 머지 불가
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          REDIS_HOST: localhost
          # CI에서 Redis 서비스 컨테이너가 localhost로 뜸
          # application.yml에서 ${REDIS_HOST:localhost} 기본값 있어서 없어도 되긴 함
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          # CI Redis 컨테이너는 비밀번호 없이 뜨므로 빈 값 설정
          # 빌드/테스트 시 필요한 환경변수 주입
          # .env 파일은 깃허브에 안 올라가니까 GitHub Secrets에서 읽어옴

      - name: 테스트 결과 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/build/reports/tests/test/

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 세팅
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # GitHub 서버에 Node.js 20 설치
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          # setup-node가 내부적으로 actions/cache를 자동 실행
          # package-lock.json 기반으로 캐시 키 생성 및 관리
          # 기존에 actions/cache를 따로 쓰던 방식보다 코드가 간결해짐

      - name: 의존성 설치
        run: npm ci
        working-directory: frontend
        # Gradle은 ./gradlew build 하나로 의존성 + 빌드 + 테스트 전부 처리
        # npm은 의존성 설치(npm ci)와 빌드(npm run build)가 분리되어 있어서 따로 실행
        # npm ci → package-lock.json 기반으로 정확한 버전 설치

      - name: 빌드
        run: npm run build
        working-directory: frontend
        # Next.js 빌드
        # next.config.ts에 output: 'standalone' 설정으로 standalone 폴더 생성
        env:
          NEXT_PUBLIC_KAKAO_MAP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_KEY }}
          # NEXT_PUBLIC_ 접두사가 붙은 변수는 빌드 시 번들에 포함됨
          # 브라우저에서 카카오 지도 SDK 로드할 때 사용
          # GitHub Secrets에서 읽어옴

          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          # 백엔드 API URL - 빌드 시 번들에 포함됨
          # 운영/개발 환경에 맞게 GitHub Secrets에서 동적으로 주입

          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          # 팀원이 다르게 쓴 백엔드 API URL 환경변수명
          # 동일한 값으로 설정