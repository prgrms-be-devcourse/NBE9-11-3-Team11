# 배포 전용 docker-compose 파일
# 로컬용(docker-compose.yml)과 다른 점:
# - MySQL 컨테이너 없음 → RDS 사용(Postgre)
# - 이미지를 Docker Hub에서 pull해서 실행
# - EC2 사양에 따라 Prometheus, Grafana 추가 가능한데 일단 제거
# 배포 전용 docker-compose 파일
# 로컬용(docker-compose.yml)과 다른 점:
# MySQL 컨테이너 없음 → RDS 사용
# 이미지를 Docker Hub에서 pull해서 실행

services:
  #백엔드
  backend:
    # CD에서 빌드 후 Docker Hub에 올린 이미지를 pull해서 실행
    # DOCKER_USERNAME은 EC2의 .env 파일에서 읽어옴
    image: ${DOCKER_USERNAME}/kagong-backend:latest

    # 로컬 루트의 .env가 아니라 EC2 서버에 직접 생성한 .env 파일
    # CD 배포 전 EC2에 .env 파일이 있어야 함
    # docker-compose.prod.yml 실행하는 위치 기준에 따라 읽는 env 파일이 달라짐
    env_file:
      - .env

    environment:
      # 운용환경 야물 파일 읽게 하기
      SPRING_PROFILES_ACTIVE: prod
     # RDS 확정 후 수정 필요
      # MySQL 사용 시:
      # SPRING_DATASOURCE_URL: jdbc:mysql://${RDS_ENDPOINT}:3306/cafe_study?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      # PostgreSQL 사용 시:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_ENDPOINT}:5432/cafe_study

      #같은 네트워크 안에 있어서 컨테이너명(redis)으로 접근
      REDIS_HOST: redis
      #컨테이너 포트
      REDIS_PORT: "6379"
      #레디스
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    # 백엔드/프론트/Redis는 expose로 내부에서만 접근
    # posts는 호스트(ec2)에도 포트를 열어서 외부에서 직접 접근 가능하게함
    # 사실 같은 docker-compose 안에 있으면 expose 없어도 컨테이너명으로 접근 가능
    # expose는 사실상 문서화 목적 "이 컨테이너는 8080 포트를 쓴다"고 명시해주는 역할
    # expose 없어도 Nginx에서 backend:8080으로 접근 가능
    expose:
      - "8080"

    # redis 생성 하고 다음 진행하게 끔
    depends_on:
      - redis
    # 컨테이너가 죽으면 자동으로 재시작하는 설정
    restart: always

  # 프론트엔드
  frontend:
    # CD에서 빌드 후 Docker Hub에 올린 이미지를 pull해서 실행
    image: ${DOCKER_USERNAME}/kagong-frontend:latest

    # 외부에 직접 노출 안 하고 Nginx가 내부 네트워크로 접근
    expose:
      - "3000"

    # 백엔드 생성하고 다음에 진행되게 끔
    depends_on:
      - backend
    # 컨테이너가 죽으면 자동으로 재시작하는 설정
    restart: always

  # nginx 설정
  nginx:
    # 최신 이미지 가져옴
    image: nginx:latest

    # 외부에서 80포트로 들어오는 요청을 Nginx가 받아서
    # /api/** → backend:8080
    # 나머지  → frontend:3000 으로 라우팅
    ports:
      - "80:80"

    # Nginx 컨테이너는 시작할 때 /etc/nginx/nginx.conf 읽어서 라우팅 규칙 적용
    # EC2 서버에 있는 nginx.conf 파일(./nginx.conf)
    # Nginx 컨테이너가 설정 파일 읽는 위치(/etc/nginx/nginx.conf )
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

    # 백,프론트 먼저 실행되고 다음에 실해되게 함
    depends_on:
      - backend
      - frontend

    # 컨테이너가 죽으면 자동으로 재시작하는 설정
    restart: always

  # 레디스 설정
  redis:
    # 기반이 될 이미지
    image: redis:7

    # .env 파일에서 읽은 REDIS_PASSWORD 값을 컨테이너 내부 환경변수로 넣어주는 것
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

    # Redis 시작할 때 비밀번호 설정하는 명령어
    command: sh -c "redis-server --requirepass $$REDIS_PASSWORD"

    # 외부 노출 안되고 컨테이너끼리 통신
    expose:
      - "6379"

    # 레디스가 종료되어도 데이터 저장되게 끔 볼륨 설정
    volumes:
      - redis-data:/data

    # 컨테이너가 죽으면 자동으로 재시작하는 설정
    restart: always

# Redis 데이터 영구 저장용 볼륨
volumes:
  redis-data:


