services:

  # 백엔드 컨테이너
  # Spring Boot 애플리케이션을 실행하는 서비스
  backend:
    # Docker Hub에 올라간 백엔드 이미지를 사용
    # TODO: DockerHub 계정명은 CI/CD 담당 팀원이 확정 후 수정
    image: kagongday/kagongday-backend:latest

    # ..env 파일에 작성된 환경변수 값을 컨테이너 내부에서 사용
    # DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET 등
    env_file:
      - .env

    # Redis는 같은 docker-compose 네트워크 안에 있으므로
    # 컨테이너 이름(redis)으로 접근 가능
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Redis 비밀번호 (..env 파일에서 읽어옴)
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    # 외부에 8080 포트를 직접 공개하지 않고
    # nginx 컨테이너가 내부 네트워크로 backend:8080에 접근하게 함
    expose:
      - "8080"

    # backend 실행 전 redis 컨테이너를 먼저 실행
    # 단, redis가 완전히 준비됐는지까지 보장하는 건 아님
    depends_on:
      - redis

    # 컨테이너가 죽거나 서버 재시작 시 자동 재시작
    restart: always


  # 프론트엔드 컨테이너
  # Next.js 애플리케이션을 실행하는 서비스
  frontend:
    # Docker Hub에 올라간 프론트엔드 이미지를 사용
    # TODO: DockerHub 계정명은 CI/CD 담당 팀원이 확정 후 수정
    image: kagongday/kagongday-frontend:latest

    # 외부에 3000 포트를 직접 공개하지 않고
    # nginx가 내부 네트워크로 frontend:3000에 접근하게 함
    expose:
      - "3000"

    # frontend 실행 전 backend 컨테이너를 먼저 실행
    depends_on:
      - backend

    # 컨테이너가 죽거나 서버 재시작 시 자동 재시작
    restart: always


  # Nginx 컨테이너
  # 외부 사용자의 요청을 받아 프론트엔드/백엔드로 전달하는 역할
  nginx:
    # 공식 nginx 이미지 사용
    image: nginx:latest

    # EC2 서버의 80번 포트를 nginx 컨테이너의 80번 포트와 연결
    # 사용자는 http://서버IP 또는 도메인으로 접속
    ports:
      - "80:80"

    # 로컬 nginx 설정 파일을 컨테이너 내부 설정 파일 위치에 연결
    # nginx.conf에서 프론트/백엔드 라우팅 규칙을 작성
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

    # nginx 실행 전 backend, frontend 컨테이너를 먼저 실행
    depends_on:
      - backend
      - frontend

    # 컨테이너가 죽거나 서버 재시작 시 자동 재시작
    restart: always


  # Redis 컨테이너
  # 백엔드에서 캐시, 임시 데이터, 세션/토큰 관리 등에 사용할 수 있음
  redis:
    # Redis 7 버전 공식 이미지 사용
    image: redis:7

    # Redis 접속 시 비밀번호를 요구하도록 설정
    # REDIS_PASSWORD 값은 프로젝트 루트의 ..env 파일에서 읽어옴
    command: redis-server --requirepass ${REDIS_PASSWORD}

    # 외부에는 Redis 포트를 공개하지 않음
    # backend 컨테이너만 내부 네트워크에서 redis:6379로 접근
    expose:
      - "6379"

    # 컨테이너가 죽거나 서버 재시작 시 자동 재시작
    restart: always


  # Prometheus 컨테이너
  # Spring Boot Actuator 메트릭을 주기적으로 수집하는 모니터링 도구
  prometheus:
    # Prometheus 공식 이미지 사용
    image: prom/prometheus

    # EC2 서버의 9090 포트로 Prometheus UI 접근 가능
    # 운영에서는 보안상 외부 공개 여부를 팀과 논의 필요
    ports:
      - "9090:9090"

    # Prometheus 수집 설정 파일을 컨테이너 내부로 연결
    # prometheus.yml 안에 backend:8080 같은 수집 대상 작성
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    # 컨테이너가 죽거나 서버 재시작 시 자동 재시작
    restart: always


  # Grafana 컨테이너
  # Prometheus가 수집한 데이터를 대시보드로 시각화하는 도구
  grafana:
    # Grafana 공식 이미지 사용
    image: grafana/grafana

    # EC2 서버의 3001 포트를 Grafana 컨테이너의 3000 포트와 연결
    # 프론트엔드가 3000을 쓰기 때문에 호스트에서는 3001 사용
    ports:
      - "3001:3000"

    # Grafana 실행 전 Prometheus 컨테이너를 먼저 실행
    depends_on:
      - prometheus

    # 컨테이너가 죽거나 서버 재시작 시 자동 재시작
    restart: always