# =========================
# Nginx 기본 이벤트 설정
# =========================
events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name _;
        client_max_body_size 10M;

        # =========================
        # 프론트엔드 검색 API 라우팅 (반드시 /api/ 보다 위에 있어야 함)
        # =========================
        # /api/search는 Next.js route.ts가 처리하는 서버사이드 API
        # 문제: /api/로 시작하기 때문에 아래 백엔드 라우팅에 매칭되어 백엔드로 전달됨
        # 해결: /api/search를 /api/ 보다 먼저 선언해서 프론트로 전달
        # nginx는 더 구체적인 경로를 우선 매칭하지 않고 선언 순서대로 매칭하므로
        # 반드시 /api/search 블록이 /api/ 블록보다 위에 있어야 함
        location /api/search {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # 백엔드 API 라우팅
        # =========================
        # /api/로 시작하는 요청은 Spring Boot backend 컨테이너로 전달
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # 프론트엔드 라우팅
        # =========================
        # /api/가 아닌 나머지 모든 요청은 Next.js frontend 컨테이너로 전달
        location / {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}