# =========================
# Nginx 기본 이벤트 설정
# =========================
# Nginx가 동시에 처리할 수 있는 연결 수 설정
# 1024는 기본적인 소규모 서비스에서 무난한 값
events {
    worker_connections 1024;
}


http {
    server {
        # =========================
        # 외부 요청 수신 포트
        # =========================
        # EC2의 80번 포트로 들어온 HTTP 요청을 nginx 컨테이너가 받음
        listen 80;

        # =========================
        # 서버 이름 설정
        # =========================
        # 아직 도메인이 없으므로 모든 요청을 받도록 _ 사용
        # 추후 도메인 연결 시 예: server_name kagongday.com;
        server_name _;

        # =========================
        # 요청 본문 크기 제한
        # =========================
        # 기본값은 작아서 이미지 업로드나 큰 JSON 요청 시 413 에러가 날 수 있음
        # 우선 10MB까지 허용
        client_max_body_size 10M;


        # =========================
        # 백엔드 API 라우팅
        # =========================
        # /api/로 시작하는 요청은 Spring Boot backend 컨테이너로 전달
        # proxy_pass 끝에 /를 붙이지 않아야 함
        # /api 경로가 제거되지 않고 그대로 백엔드에 전달됨
        location /api/ {
            proxy_pass http://backend:8080;

            # 원래 요청의 Host 정보 전달
            proxy_set_header Host $host;

            # 실제 클라이언트 IP 전달
            proxy_set_header X-Real-IP $remote_addr;

            # 프록시를 거친 클라이언트 IP 목록 전달
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 요청 프로토콜 정보 전달
            # 현재는 http, 추후 https 적용 시 https로 전달됨
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # =========================
        # 프론트엔드 라우팅
        # =========================
        # /api/가 아닌 나머지 모든 요청은 Next.js frontend 컨테이너로 전달
        location / {
            proxy_pass http://frontend:3000;

            # 원래 요청의 Host 정보 전달
            proxy_set_header Host $host;

            # 실제 클라이언트 IP 전달
            proxy_set_header X-Real-IP $remote_addr;

            # 프록시를 거친 클라이언트 IP 목록 전달
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 요청 프로토콜 정보 전달
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}